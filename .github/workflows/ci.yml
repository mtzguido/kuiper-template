name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, verify, extract, and check dist
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fstarlang/kuiper-base-nocuda:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean runner workspace
        run: find . -delete

      - name: Check out the project
        uses: actions/checkout@v6

      - name: Set up the build environment
        run: |
          echo "HOME=/home/vscode" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Read the Kuiper package pin
        id: kuiper_pin
        run: |
          nightly=$(<kuiper-version.txt)
          [[ "$nightly" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      - name: Restore the Kuiper binary package
        uses: actions/cache@v5
        with:
          path: .kuiper
          key: kuiper-nightly-${{ steps.kuiper_pin.outputs.nightly }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned tools
        run: make -skj4 prepare

      - name: Lint
        run: make -skj4 lint

      - name: Report explicit trust markers
        run: make -skj4 list-admits

      - name: Verify
        run: |
          jobs=$(scripts/ci-jobs.sh 3072)
          echo "Verifying with $jobs job(s)."
          make -skj"$jobs" verify

      - name: Extract
        run: |
          jobs=$(scripts/ci-jobs.sh 8192)
          echo "Extracting with $jobs job(s)."
          make -skj"$jobs" extract-all

      - name: Check the generated distribution
        run: |
          make -skj4 dist
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
