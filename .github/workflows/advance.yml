name: Advance Kuiper package

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  verify:
    name: Verify candidate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fstarlang/kuiper-base-nocuda:latest
    defaults:
      run:
        shell: bash
    outputs:
      moved: ${{ steps.pin.outputs.moved }}
      latest: ${{ steps.pin.outputs.latest }}
    steps:
      - name: Clean runner workspace
        run: find . -delete

      - name: Check out the project without credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the build environment
        run: |
          echo "HOME=/home/vscode" >> "$GITHUB_ENV"
          echo "PATH=/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Find the newest Kuiper nightly
        id: pin
        run: |
          current=$(<kuiper-version.txt)
          [[ "$current" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          latest_tag=$(./scripts/install-kuiper.sh --nightly --list |
            grep '^nightly-' | sort -r | head -1)
          test -n "$latest_tag"
          latest=${latest_tag#nightly-}
          [[ "$latest" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$latest" ]]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "Kuiper is already at nightly $current."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "Trying Kuiper nightly $latest (currently $current)."
          fi

      - name: Restore the candidate package
        if: ${{ steps.pin.outputs.moved == 'true' }}
        uses: actions/cache@v5
        with:
          path: .kuiper
          key: kuiper-nightly-${{ steps.pin.outputs.latest }}-${{ runner.os }}-${{ runner.arch }}

      - name: Select the candidate pin
        if: ${{ steps.pin.outputs.moved == 'true' }}
        env:
          LATEST: ${{ steps.pin.outputs.latest }}
        run: printf '%s\n' "$LATEST" > kuiper-version.txt

      - name: Lint, verify, extract, and refresh dist
        if: ${{ steps.pin.outputs.moved == 'true' }}
        run: |
          make -j4 prepare
          make -j4 lint
          verify_jobs=$(scripts/ci-jobs.sh 3072)
          make -j"$verify_jobs" verify
          extract_jobs=$(scripts/ci-jobs.sh 8192)
          make -j"$extract_jobs" extract-all
          make -j4 dist
          git diff --check

          unexpected=$(git diff --name-only |
            grep -Ev '^(kuiper-version\.txt|dist/)' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Candidate modified unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --binary -- dist > dist.patch

      - name: Upload the verified dist patch
        if: ${{ steps.pin.outputs.moved == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: kuiper-candidate-dist
          path: dist.patch
          if-no-files-found: error

  open_pr:
    name: Open advance pull request
    needs: [verify]
    if: ${{ needs.verify.outputs.moved == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out the project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified dist patch
        uses: actions/download-artifact@v7
        with:
          name: kuiper-candidate-dist
          path: candidate

      - name: Reconstruct the verified candidate
        env:
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          [[ "$LATEST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          printf '%s\n' "$LATEST" > kuiper-version.txt
          if [[ -s candidate/dist.patch ]]; then
            git apply candidate/dist.patch
          fi
          unexpected=$(git diff --name-only |
            grep -Ev '^(kuiper-version\.txt|dist/)' || true)
          test -z "$unexpected"
          git diff --check

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.verify.outputs.latest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch=advance/kuiper-package
          title="Advance Kuiper package to $LATEST"
          git config user.name "Actions bot"
          git config user.email "none@none"
          git checkout -B "$branch"
          git add kuiper-version.txt dist
          git commit -m "$title"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin "$branch"

          body="Automated Kuiper nightly advance to $LATEST. Verification and extraction succeeded; review any generated CUDA changes in dist/."
          pr=$(gh pr list --repo "$REPOSITORY" --head "$branch" \
            --state open --json number --jq '.[0].number')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --repo "$REPOSITORY" \
              --title "$title" --body "$body"
          else
            gh pr create --repo "$REPOSITORY" --base "$DEFAULT_BRANCH" \
              --head "$branch" --title "$title" --body "$body"
          fi

          # Pull requests created with GITHUB_TOKEN do not trigger PR workflows.
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"
